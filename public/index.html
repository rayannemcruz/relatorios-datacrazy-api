<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataCrazy – Relatórios</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --border: #E2E8F0; --border-soft: #F1F5F9;
    --text: #0F172A; --muted: #64748B; --faint: #94A3B8;
    --accent: #2563EB; --accent-soft: #DBEAFE; --navy: #0F172A; --danger: #b91c1c; --ok: #15803d;
    --radius: 8px; --sidebar: 264px;
    /* sidebar escura */
    --side-text: #CBD5E1; --side-muted: #94A3B8; --side-hover: rgba(255,255,255,.06); --side-line: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- layout ---------- */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: var(--sidebar); flex-shrink: 0; background: var(--navy); color: var(--side-text); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
  .brand { padding: 22px 20px 18px; border-bottom: 1px solid var(--side-line); }
  .brand strong { display: block; font-size: 16px; letter-spacing: -.01em; color: #fff; }
  .brand span { font-size: 12px; color: var(--side-muted); }
  .nav { padding: 14px 12px 24px; }
  .nav-group { margin-bottom: 6px; }
  .nav-title { font-size: 13.5px; font-weight: 500; color: var(--side-text); padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; }
  .nav a { display: block; padding: 7px 10px; border-radius: 6px; color: var(--side-text); text-decoration: none; font-size: 13px; }
  .nav a:hover { background: var(--side-hover); color: #fff; }
  .nav a.active { background: var(--accent); color: #fff; font-weight: 500; }
  .nav a small { display: block; font-size: 11.5px; color: var(--side-muted); font-weight: 400; }
  .nav a.active small { color: #fff; opacity: .8; }
  .nav .none { font-size: 12.5px; color: var(--side-muted); padding: 4px 10px; }
  .nav-toggle { width: 100%; background: none; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; text-align: left; }
  button.nav-title:hover, .nav-month:hover { background: var(--side-hover); color: #fff; }
  .nav-title .lbl, .nav a.nav-main { display: flex; align-items: center; gap: 10px; }
  .nav a.nav-main { font-size: 13.5px; font-weight: 500; padding: 8px 10px; margin-bottom: 6px; }
  .nav-ico { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-month { padding: 6px 10px; font-size: 12.5px; font-weight: 500; color: var(--side-text); border-radius: 6px; }
  .nav-toggle .right { display: flex; align-items: center; gap: 8px; }
  .nav-toggle .count { font-size: 11px; color: var(--side-muted); font-weight: 500; }
  .chev { width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin: 0 4px 3px 0; transition: transform .15s; color: var(--side-muted); }
  .nav-group.collapsed > .nav-toggle .chev { transform: rotate(-45deg); margin-bottom: 0; }
  .nav-group.collapsed > .nav-items { display: none; }
  .nav-group > .nav-items { margin: 2px 0 8px 18px; padding-left: 10px; border-left: 1px solid var(--side-line); }
  .nav-sub { margin-bottom: 2px; }
  .nav-sub > .nav-items { margin: 2px 0 6px 10px; }
  .nav-group.destaque > .nav-toggle { background: var(--side-hover); color: #fff; }

  .main { flex: 1; min-width: 0; padding: 32px 40px 64px; }
  .view { max-width: 1280px; }
  .view[hidden] { display: none; }
  .view-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
  .view-head > div { flex: 1; min-width: 0; }
  .view-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
  .view-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .view-head .pedido { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--border); }
  .view-head code, .toolbar code { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); }

  .menu-btn { display: none; }

  /* ---------- controles ---------- */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input, select { height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 13px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input.search { width: 220px; }
  .btn { height: 32px; padding: 0 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--bg); }
  .btn:disabled { opacity: .4; cursor: default; }

  /* ---------- conteúdo ---------- */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .meta { font-size: 12px; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--border-soft); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .card .l { font-size: 12px; color: var(--muted); }
  .card .v { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-top: 2px; }
  h3.sec { font-size: 14px; font-weight: 600; margin: 24px 0 10px; }
  .secao + .secao { margin-top: 8px; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 16px; text-align: left; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  th { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; background: #fbfbfc; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fafafb; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; color: #fff; margin: 1px 2px 1px 0; white-space: nowrap; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; background: #f1f1f3; color: #3f3f46; white-space: nowrap; }
  .yes { color: var(--ok); } .no { color: var(--faint); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid #0001; }
  .empty, .error { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); }
  .welcome { padding: 64px 16px; text-align: center; color: var(--muted); }
  .welcome h1 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
  a.brand { display: block; color: inherit; text-decoration: none; }

  /* ---------- tela inicial ---------- */
  .home { max-width: 1120px; }
  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 40px 44px; margin-bottom: 24px; }
  .hero .ola { color: var(--accent); font-weight: 600; font-size: 15px; margin: 0 0 8px; }
  .hero h1 { margin: 0 0 12px; font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.025em; color: var(--navy); }
  .hero p.desc { margin: 0; color: var(--muted); font-size: 15px; max-width: 440px; }
  .hero-chart { width: 100%; height: auto; display: block; }
  .home-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .home-card { display: block; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; cursor: pointer; color: var(--text); text-decoration: none; transition: border-color .15s, box-shadow .15s; }
  .home-card:hover { border-color: #BFDBFE; box-shadow: 0 6px 20px rgba(15, 23, 42, .06); }
  .home-card .ico { width: 42px; height: 42px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .home-card .ico svg { width: 22px; height: 22px; }
  .home-card strong { display: block; font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--navy); }
  .home-card span { color: var(--muted); font-size: 13px; }
  @media (max-width: 860px) {
    .hero { grid-template-columns: minmax(0, 1fr); padding: 28px 24px; }
    .hero > * { min-width: 0; }
    .hero h1 { font-size: 24px; }
    .home-cards { grid-template-columns: 1fr; }
  }

  dialog { width: min(860px, 92vw); max-height: 85vh; border: 1px solid var(--border); border-radius: 10px; padding: 0; box-shadow: 0 20px 50px rgba(0,0,0,.15); }
  dialog::backdrop { background: rgba(24,24,27,.35); }
  dialog .head { position: sticky; top: 0; background: var(--surface); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  dialog h2 { margin: 0; font-size: 14px; font-weight: 600; }
  dialog pre { margin: 0; padding: 16px; font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }

  /* ---------- celular ---------- */
  @media (max-width: 860px) {
    .sidebar { position: fixed; left: 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.12); }
    .app.menu-open .sidebar { transform: none; }
    .main { padding: 20px 16px 48px; }
    .menu-btn { display: inline-flex; align-items: center; }
    input.search { width: 100%; }
  }
</style>

<body>
<div class="app" id="app">
  <aside class="sidebar">
    <a class="brand" href="#" title="Tela inicial"><strong>DataCrazy</strong><span>Relatórios e dados do CRM</span></a>
    <nav class="nav">
      <a href="#" class="nav-main" data-rota=""><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Início</a>
      <div class="nav-group" data-key="relatorios" id="grupoRelatorios">
        <button class="nav-title nav-toggle"><span class="lbl"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Relatórios</span><span class="right"><span class="count" id="relCount"></span><span class="chev"></span></span></button>
        <div id="navRelatorios" class="nav-items"></div>
      </div>
      <div class="nav-group" data-key="acervo" id="grupoAcervo">
        <button class="nav-title nav-toggle"><span class="lbl"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3z"/><path d="M3 7l2-4h14l2 4"/><path d="M10 12h4"/></svg>Acervo</span><span class="right"><span class="chev"></span></span></button>
        <div id="navAcervo" class="nav-items"></div>
      </div>
    </nav>
  </aside>
  <main class="main" id="main"></main>

<dialog id="modal">
  <div class="head"><h2 id="modalTitle">Detalhes</h2><button class="btn" onclick="modal.close()">Fechar</button></div>
  <pre id="modalBody"></pre>
</dialog>

<script>
// Local com outro servidor (ex.: Live Server na 5500) usa o server.js na 3000; no server.js e na Vercel usa /api.
const API_URL = ['localhost', '127.0.0.1', ''].includes(location.hostname) && location.port !== '3000' ? 'http://localhost:3000/api' : '/api';

// ---------- helpers de formatação (também usados pelos relatórios) ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const date = v => v ? new Date(v).toLocaleString('pt-BR') : '';
const day = v => v ? new Date(v).toLocaleDateString('pt-BR') : '';
const money = v => v == null ? '' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => v == null ? '' : Number(v).toLocaleString('pt-BR');
const bool = v => v ? '<span class="yes">Sim</span>' : '<span class="no">Não</span>';
const tags = arr => (arr || []).map(t => `<span class="tag" style="background:${esc(t.color || '#888')}">${esc(t.name)}</span>`).join('');
const pill = (text, color) => text ? `<span class="tag" style="background:${esc(color || '#888')}">${esc(text)}</span>` : '';
const color = v => v ? `<span class="swatch" style="background:${esc(v)}"></span>${esc(v)}` : '';
const badge = v => v ? `<span class="badge">${esc(v)}</span>` : '';
const STATUS_NEGOCIO = { in_process: 'Em andamento', won: 'Ganho', lost: 'Perdido' };
const status = v => badge(STATUS_NEGOCIO[v] || v);
const fmt = { esc, date, day, money, num, bool, tags, pill, color, badge, status };

// ---------- cliente da API (também usado pelos relatórios) ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
const api = {
  // GET simples. params: objeto { take: 10, 'filter[status]': 'won' }
  async get(path, params = {}) {
    const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null)).toString();
    for (let tentativa = 0; tentativa < 4; tentativa++) {
      let res;
      try { res = await fetch(API_URL + '/proxy?__path=' + encodeURIComponent(path.replace(/^\/+/, '')) + (qs ? '&' + qs : '')); }
      catch { throw new Error(`Não foi possível conectar em ${API_URL}. Rode "npm start" na pasta do projeto.`); }
      if (res.status === 429) { await sleep((Number(res.headers.get('Retry-After')) || 10) * 1000); continue; }
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch { throw new Error(`Resposta não é JSON (HTTP ${res.status}). O servidor está rodando?`); }
      if (!res.ok) throw new Error(json.message || json.error || JSON.stringify(json));
      return json;
    }
    throw new Error('Limite de requisições da API atingido. Tente novamente em 1 minuto.');
  },
  // Busca todas as páginas (skip/take) até acabar ou chegar em `max` registros
  async getAll(path, params = {}, { max = 5000, pageSize = 500 } = {}) {
    const rows = [];
    for (let skip = 0; rows.length < max && skip <= 10000; skip += pageSize) {
      const json = await api.get(path, { ...params, skip, take: pageSize });
      const page = Array.isArray(json) ? json : (json.data || []);
      rows.push(...page);
      if (page.length < pageSize) break;
    }
    return rows.slice(0, max);
  },
};

// ---------- tabela + modal de JSON ----------
const tableRows = [];
function table(cols, rows) {
  if (!rows.length) return '<div class="empty">Nenhum registro.</div>';
  const base = tableRows.length;
  tableRows.push(...rows);
  return `<div class="tablewrap"><table>
    <thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr data-i="${base + i}">${cols.map(c => `<td>${c[1](r) ?? ''}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}
document.addEventListener('click', e => {
  const tr = e.target.closest('tr[data-i]');
  if (!tr) return;
  const row = tableRows[tr.dataset.i];
  $('modalTitle').textContent = String(row.name || row.lead?.name || row.id || 'Detalhes').trim();
  $('modalBody').textContent = JSON.stringify(row, null, 2);
  $('modal').showModal();
});

// Colunas genéricas para endpoints sem configuração
function autoColumns(rows) {
  const keys = [...new Set(rows.flatMap(r => Object.keys(r)))]
    .filter(k => rows.some(r => r[k] == null || typeof r[k] !== 'object' || r[k]?.name));
  return keys.slice(0, 10).map(k => [k, r => {
    const v = r[k];
    if (v && typeof v === 'object') return esc(v.name ?? JSON.stringify(v));
    if (typeof v === 'boolean') return bool(v);
    if (/At$/.test(k)) return date(v);
    return esc(v);
  }]);
}

const $ = id => document.getElementById(id);
</script>

<script>
// ---------- ACERVO ----------
// paginated: aceita skip/take | search: aceita ?search=
const ENDPOINTS = [
  { label: 'Leads', path: '/leads', paginated: true, search: true, columns: [
    ['Nome', r => esc(r.name)], ['Telefone', r => esc(r.phone)], ['E-mail', r => esc(r.email)],
    ['Tags', r => tags(r.tags)], ['Tipo', r => badge(r.type)], ['Atendente', r => esc(r.attendant?.name)],
    ['Criado em', r => date(r.createdAt)] ] },
  { label: 'Negócios', path: '/businesses', paginated: true, search: true, columns: [
    ['Código', r => esc(r.code)], ['Lead', r => esc(r.lead?.name)], ['Pipeline', r => esc(r.stage?.pipeline?.name)],
    ['Etapa', r => pill(r.stage?.name, r.stage?.color)], ['Status', r => status(r.status)], ['Total', r => money(r.total)],
    ['Produtos', r => esc(r.productsCount)], ['Atendente', r => esc(r.attendant?.name)], ['Criado em', r => date(r.createdAt)] ] },
  { label: 'Pipelines', path: '/pipelines', search: true, columns: [
    ['Nome', r => esc(r.name)], ['Descrição', r => esc(r.description)], ['Grupo', r => esc(r.group)],
    ['Etapas', r => esc(r.stagesCount)], ['Atualizado em', r => date(r.updatedAt)] ] },
  { label: 'Conversas', path: '/conversations', paginated: true, search: true, columns: [
    ['Nome', r => esc(r.name)], ['Canal', r => badge(r.instance?.platform)], ['Conexão', r => esc(r.instance?.name)],
    ['Departamento', r => esc(r.currentDepartment?.name)], ['Atendentes', r => esc((r.attendants || []).map(a => a.name).join(', '))],
    ['Última mensagem', r => esc((r.lastMessage?.body || '').slice(0, 80))], ['Data', r => date(r.lastMessageDate)],
    ['Finalizada', r => bool(r.finished)] ] },
  { label: 'Atividades', path: '/activities', paginated: true, search: true, columns: null },
  { label: 'Tags', path: '/tags', columns: [
    ['Nome', r => pill(r.name, r.color)], ['Cor', r => color(r.color)], ['Descrição', r => esc(r.description)], ['Criada em', r => date(r.createdAt)] ] },
  { label: 'Listas', path: '/lists', columns: null },
  { label: 'Produtos', path: '/products', columns: [
    ['Nome', r => esc(r.name)], ['SKU', r => esc(r.id_sku)], ['Preço', r => money(r.price)],
    ['Integração', r => esc(r.integration_slug)], ['Criado em', r => date(r.createdAt)] ] },
  { label: 'Conexões', path: '/instances', columns: [
    ['Nome', r => esc(r.name)], ['Plataforma', r => badge(r.platform)], ['Provider', r => esc(r.provider)],
    ['Status', r => badge(r.status)], ['Ativa', r => bool(r.isActive)], ['Erro', r => esc(r.errorMessage)],
    ['Criada em', r => date(r.createdAt)] ] },
  { label: 'Atendentes (multiatendimento)', path: '/attendants/multi', search: true, columns: [
    ['Nome', r => esc(r.name)], ['E-mail', r => esc(r.email)], ['Telefone', r => esc(r.phone)], ['Agente IA', r => bool(r.isAgent)] ] },
  { label: 'Atendentes (CRM)', path: '/attendants/crm', columns: [
    ['Nome', r => esc(r.name)], ['E-mail', r => esc(r.email)], ['Telefone', r => esc(r.phone)] ] },
  { label: 'Motivos de perda', path: '/business-loss-reasons', columns: [
    ['Motivo', r => esc(r.name)], ['Exige justificativa', r => bool(r.requiredJustification)], ['Criado em', r => date(r.createdAt)] ] },
];

const menuBtn = '<button class="btn menu-btn" data-menu>Menu</button>';

// Cada item da sidebar tem uma "view" criada na primeira vez que é aberta e mantida depois
// (trocar de item e voltar não busca os dados de novo).
const views = {};

function acervoView(ep) {
  const v = document.createElement('section');
  v.className = 'view';
  v.innerHTML = `
    <div class="view-head">${menuBtn}<div><h1>${esc(ep.label)}</h1><p><code class="url">GET /api/v1${esc(ep.path)}</code></p></div></div>
    <div class="toolbar">
      ${ep.search ? '<input class="search" placeholder="Buscar">' : ''}
      <span class="grow"></span>
      ${ep.paginated ? `<select class="take" title="Itens por página"><option>10</option><option selected>25</option><option>50</option><option>100</option></select>
        <button class="btn prev">Anterior</button><button class="btn next">Próxima</button>` : ''}
      <button class="btn reload">Recarregar</button>
    </div>
    <div class="panel out"></div>`;
  const q = s => v.querySelector(s);
  const st = { skip: 0 };

  async function load() {
    const take = ep.paginated ? Number(q('.take').value) : null;
    const params = ep.paginated ? { skip: st.skip, take } : {};
    if (ep.search && q('.search').value) params.search = q('.search').value;
    const qs = new URLSearchParams(params).toString();
    q('.url').textContent = `GET /api/v1${ep.path}${qs ? '?' + qs : ''}`;
    q('.out').innerHTML = '<div class="empty">Carregando...</div>';
    try {
      const json = await api.get(ep.path, params);
      const rows = Array.isArray(json) ? json : (json.data || []);
      const total = json.count;
      const end = ep.paginated ? st.skip + rows.length : rows.length;
      if (ep.paginated) {
        q('.prev').disabled = st.skip === 0;
        q('.next').disabled = rows.length < take || (total != null && end >= total);
      }
      const meta = ep.paginated ? `${rows.length ? st.skip + 1 : 0}–${end}` : `${rows.length} registro(s)`;
      q('.out').innerHTML = `<div class="meta">${meta}${total != null ? ` de ${num(total)}` : ''}</div>` +
        table(ep.columns || autoColumns(rows), rows);
    } catch (err) {
      q('.out').innerHTML = `<div class="error">Erro: ${esc(err.message)}</div>`;
    }
  }

  q('.reload').onclick = load;
  if (ep.paginated) {
    q('.prev').onclick = () => { st.skip = Math.max(0, st.skip - Number(q('.take').value)); load(); };
    q('.next').onclick = () => { st.skip += Number(q('.take').value); load(); };
    q('.take').onchange = () => { st.skip = 0; load(); };
  }
  if (ep.search) {
    let t;
    q('.search').oninput = () => { clearTimeout(t); t = setTimeout(() => { st.skip = 0; load(); }, 400); };
  }
  load();
  return v;
}

function relatorioView(rel) {
  const v = document.createElement('section');
  v.className = 'view';
  v.innerHTML = `
    <div class="view-head">${menuBtn}<div>
      <h1>${esc(rel.titulo)}</h1>
      <p>Criado em ${esc(rel.criadoEm)}${rel.descricao ? ` · <code>${esc(rel.descricao)}</code>` : ''}</p>
      ${rel.pedido ? `<p class="pedido">Pedido: “${esc(rel.pedido)}”</p>` : ''}
    </div><button class="btn reload">Atualizar</button></div>
    <div class="out"></div>`;
  const out = v.querySelector('.out');

  async function run() {
    out.innerHTML = '<div class="panel"><div class="empty">Gerando relatório com dados atuais da API...</div></div>';
    try {
      const r = await rel.gerar(api, fmt);
      const secoes = r.secoes || [{ colunas: r.colunas, linhas: r.linhas }];
      out.innerHTML =
        (r.resumo?.length ? `<div class="cards">${r.resumo.map(c => `<div class="card"><div class="l">${esc(c.label)}</div><div class="v">${c.valor}</div></div>`).join('')}</div>` : '') +
        secoes.map(s => `<div class="secao">${s.titulo ? `<h3 class="sec">${esc(s.titulo)}</h3>` : ''}
          <div class="panel"><div class="meta">${num(s.linhas.length)} registro(s)</div>${table(s.colunas, s.linhas)}</div></div>`).join('');
    } catch (err) {
      out.innerHTML = `<div class="panel"><div class="error">Erro: ${esc(err.message)}</div></div>`;
    }
  }

  v.querySelector('.reload').onclick = run;
  run();
  return v;
}

// ---------- SIDEBAR + navegação por #hash ----------
const relatorios = [...(window.RELATORIOS || [])].reverse(); // mais recente primeiro
const rotas = {};
relatorios.forEach(rel => { rotas['rel/' + rel.id] = () => relatorioView(rel); });
ENDPOINTS.forEach(ep => { rotas['acervo' + ep.path] = () => acervoView(ep); });

// Relatórios agrupados por mês de criação (criadoEm DD/MM/AAAA), mês mais recente primeiro
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const porMes = new Map();
relatorios.forEach(r => {
  const [, m, a] = String(r.criadoEm || '').split('/').map(Number);
  const chave = a && m ? `${a}-${String(m).padStart(2, '0')}` : 'sem-data';
  if (!porMes.has(chave)) porMes.set(chave, { titulo: a && m ? `${MESES[m - 1]} ${a}` : 'Sem data', itens: [] });
  porMes.get(chave).itens.push(r);
});
const meses = [...porMes.entries()].sort((x, y) => y[0].localeCompare(x[0]));
const diaDe = r => Number(String(r.criadoEm || '').split('/')[0]) || 0;
meses.forEach(([, mes]) => mes.itens.sort((x, y) => diaDe(y) - diaDe(x))); // dia mais recente primeiro (empate: último criado primeiro)

$('relCount').textContent = relatorios.length || '';
$('navRelatorios').innerHTML = relatorios.length
  ? meses.map(([chave, mes], i) => `
    <div class="nav-group nav-sub" data-key="mes-${chave}" data-padrao="${i === 0 ? 'aberto' : 'fechado'}">
      <button class="nav-month nav-toggle"><span>${esc(mes.titulo)}</span><span class="right"><span class="count">${mes.itens.length}</span><span class="chev"></span></span></button>
      <div class="nav-items">${mes.itens.map(r => `<a href="#rel/${encodeURIComponent(r.id)}" data-rota="rel/${esc(r.id)}">${esc(r.titulo)}<small>${esc(r.criadoEm)}</small></a>`).join('')}</div>
    </div>`).join('')
  : '<div class="none">Nenhum relatório ainda</div>';
$('navAcervo').innerHTML = ENDPOINTS.map(ep => `<a href="#acervo${ep.path}" data-rota="acervo${ep.path}">${esc(ep.label)}</a>`).join('');

// Grupos recolhíveis (Relatórios, cada mês, Acervo). A escolha fica salva neste navegador.
// Padrão: Relatórios e Acervo abertos; só o mês mais recente aberto.
function setGrupo(g, aberto, salvar = true) {
  g.classList.toggle('collapsed', !aberto);
  g.querySelector(':scope > .nav-toggle').setAttribute('aria-expanded', aberto);
  if (salvar) localStorage.setItem('grupo:' + g.dataset.key, aberto ? '1' : '0');
}
document.querySelectorAll('.nav-group[data-key]').forEach(g => {
  const salvo = localStorage.getItem('grupo:' + g.dataset.key);
  setGrupo(g, salvo != null ? salvo === '1' : g.dataset.padrao !== 'fechado', false);
  g.querySelector(':scope > .nav-toggle').onclick = () => setGrupo(g, g.classList.contains('collapsed'));
});

// ---------- TELA INICIAL (estática: não faz nenhuma requisição à API) ----------
const ICONES = {
  relatorios: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  acervo: '<path d="M3 7h18v13H3z"/><path d="M3 7l2-4h14l2 4"/><path d="M10 12h4"/>',
  desempenho: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
};
const icone = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONES[k]}</svg>`;

function telaInicial() {
  // Gráfico ilustrativo: linha crescente, sem números nem eixos
  const pts = [[20, 190], [70, 172], [115, 180], [160, 140], [205, 150], [250, 108], [295, 118], [340, 70], [380, 40]];
  const linha = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x} ${y}`).join(' ');
  const grafico = `<svg class="hero-chart" viewBox="0 0 400 220" aria-hidden="true">
    <defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563EB" stop-opacity=".22"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></linearGradient></defs>
    ${[50, 100, 150, 200].map(y => `<line x1="10" x2="390" y1="${y}" y2="${y}" stroke="#E2E8F0" stroke-dasharray="4 6"/>`).join('')}
    <path d="${linha} L380 210 L20 210 Z" fill="url(#gArea)"/>
    <path d="${linha}" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.slice(1, -1).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="#fff" stroke="#93C5FD" stroke-width="2"/>`).join('')}
    <circle cx="380" cy="40" r="10" fill="#DBEAFE"/><circle cx="380" cy="40" r="5" fill="#2563EB"/>
  </svg>`;
  const card = (k, titulo, texto) => `<button class="home-card" data-ir="${k}"><div class="ico">${icone(k)}</div><strong>${titulo}</strong><span>${texto}</span></button>`;
  return `<div class="view-head">${menuBtn}</div>
    <div class="home">
      <section class="hero">
        <div>
          <p class="ola">Bem-vindo(a)!</p>
          <h1>Relatórios BS Seguros e DataCrazy</h1>
          <p class="desc">Acompanhe os principais indicadores, resultados e dados do CRM em um só lugar.</p>
        </div>
        ${grafico}
      </section>
      <div class="home-cards">
        ${card('relatorios', 'Relatórios', 'Visualize os indicadores e resultados do CRM.')}
        ${card('acervo', 'Acervo', 'Acesse materiais, planilhas e documentos.')}
        ${card('desempenho', 'Desempenho', 'Acompanhe a evolução das suas operações.')}
      </div>
    </div>`;
}

// Cards da tela inicial: Relatórios e Acervo abrem o grupo na lateral; Desempenho abre o relatório de desempenho mais recente.
document.addEventListener('click', e => {
  const card = e.target.closest('[data-ir]');
  if (!card) return;
  const ir = card.dataset.ir;
  if (ir === 'desempenho') {
    const rel = relatorios.find(r => /desempenho/i.test(r.id)) || relatorios[0];
    if (rel) { location.hash = 'rel/' + encodeURIComponent(rel.id); return; }
  }
  const g = $(ir === 'acervo' ? 'grupoAcervo' : 'grupoRelatorios');
  setGrupo(g, true);
  $('app').classList.add('menu-open');
  g.classList.add('destaque');
  g.scrollIntoView({ block: 'nearest' });
  setTimeout(() => g.classList.remove('destaque'), 1500);
});

function abrir() {
  let rota = decodeURIComponent(location.hash.slice(1));
  if (!rotas[rota]) rota = null; // tela inicial: não busca nada na API até o usuário escolher um item
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.rota === (rota || '')));
  // Se o item aberto estiver dentro de um grupo fechado (ex.: link direto), abre os grupos acima dele
  for (let g = location.hash && document.querySelector('.nav a.active')?.closest('.nav-group'); g; g = g.parentElement.closest('.nav-group')) {
    if (g.classList.contains('collapsed')) setGrupo(g, true, false);
  }
  Object.values(views).forEach(v => { v.hidden = true; });
  $('app').classList.remove('menu-open');
  if (!rota) {
    if (!views.inicio) {
      views.inicio = document.createElement('section');
      views.inicio.className = 'view';
      views.inicio.innerHTML = telaInicial();
      $('main').appendChild(views.inicio);
    }
    views.inicio.hidden = false;
    return;
  }
  if (!views[rota]) { views[rota] = rotas[rota](); $('main').appendChild(views[rota]); }
  views[rota].hidden = false;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', abrir);
document.addEventListener('click', e => { if (e.target.closest('[data-menu]')) $('app').classList.toggle('menu-open'); });
abrir();
</script>
